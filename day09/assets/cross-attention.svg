<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="740" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">02 / Cross-Attention：行数跟目标走，列数跟源句走</text><text x="48" y="94" font-size="18" fill="#475569">例：B=2，H=8，目标长度 Tt=6，源长度 Ts=10，每头 D=64。</text><rect x="45" y="145" width="385" height="120" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="237.5" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Decoder 隐藏状态 → Q</text><text x="237.5" y="213" text-anchor="middle" font-size="18" fill="#334155">[2,8,6,64]</text><text x="237.5" y="242" text-anchor="middle" font-size="18" fill="#334155">6 个目标查询</text><rect x="45" y="345" width="385" height="140" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="237.5" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Encoder 输出 → K、V</text><text x="237.5" y="413" text-anchor="middle" font-size="18" fill="#334155">K：[2,8,10,64]</text><text x="237.5" y="442" text-anchor="middle" font-size="18" fill="#334155">V：[2,8,10,64]</text><rect x="585" y="210" width="755" height="140" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="962.5" y="245" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q @ Kᵀ / √64 → Softmax</text><text x="962.5" y="278" text-anchor="middle" font-size="18" fill="#334155">分数与权重：[2,8,6,10]</text><text x="962.5" y="307" text-anchor="middle" font-size="18" fill="#334155">每个目标位置对 10 个源位置分配权重</text><path d="M430,205 L580,250" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M430,390 L580,310" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="585" y="465" width="755" height="130" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="962.5" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">权重 @ V → 合并 Head → 输出投影</text><text x="962.5" y="533" text-anchor="middle" font-size="18" fill="#334155">[2,8,6,64] → [2,6,512]</text><text x="962.5" y="562" text-anchor="middle" font-size="18" fill="#334155">输出长度仍是 6，不会变成源句长度 10</text><path d="M965,350 L965,460" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M430,450 L510,450" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M510,450 L510,530" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M510,530 L580,530" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="655" text-anchor="middle" font-size="18" fill="#475569">Self-Attention：Q/K/V 同源。Cross-Attention：Q 来自目标侧，K/V 来自源侧。</text><text x="700" y="700" text-anchor="middle" font-size="18" fill="#475569">Cross-Attention 不需要按目标顺序屏蔽源句未来；有 Padding 时仍需屏蔽源句填充位置。</text></g></svg>