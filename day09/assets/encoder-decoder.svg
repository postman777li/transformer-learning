<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="940" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">01 / Encoder–Decoder：先理解源句，再参考它生成目标句</text><text x="48" y="94" font-size="18" fill="#475569">贯穿例子：I love you → 我 爱 你。这里展示结构与信息流，省略每个子层的 Residual / LayerNorm。</text><rect x="60" y="145" width="420" height="110" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="270.0" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">源句：I / love / you</text><text x="270.0" y="213" text-anchor="middle" font-size="18" fill="#334155">Embedding + 位置编码</text><rect x="60" y="310" width="420" height="170" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="270.0" y="345" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Encoder Block × N</text><text x="270.0" y="378" text-anchor="middle" font-size="18" fill="#334155">双向 Self-Attention</text><text x="270.0" y="407" text-anchor="middle" font-size="18" fill="#334155">FFN</text><text x="270.0" y="436" text-anchor="middle" font-size="18" fill="#334155">源句内部交换信息</text><path d="M270,255 L270,305" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="550" width="420" height="125" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="270.0" y="585" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Encoder 输出</text><text x="270.0" y="618" text-anchor="middle" font-size="18" fill="#334155">每个源 Token 一个上下文向量</text><text x="270.0" y="647" text-anchor="middle" font-size="18" fill="#334155">[B,Ts,C]</text><path d="M270,480 L270,545" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="900" y="145" width="440" height="100" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="1120.0" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">目标前缀：&lt;bos&gt; / 我 / …</text><text x="1120.0" y="213" text-anchor="middle" font-size="18" fill="#334155">Embedding + 位置编码</text><rect x="900" y="300" width="440" height="100" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="1120.0" y="335" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Decoder：Masked Self-Attention</text><text x="1120.0" y="368" text-anchor="middle" font-size="18" fill="#334155">只看目标前缀，不读取未来</text><path d="M1120,245 L1120,295" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="900" y="455" width="440" height="100" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="1120.0" y="490" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Decoder：Cross-Attention</text><text x="1120.0" y="523" text-anchor="middle" font-size="18" fill="#334155">Q 来自 Decoder；K、V 来自 Encoder</text><path d="M1120,400 L1120,450" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="900" y="610" width="440" height="95" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1120.0" y="645" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Decoder：FFN</text><text x="1120.0" y="678" text-anchor="middle" font-size="18" fill="#334155">以上三个子层组成 Block，堆叠 N 次</text><path d="M1120,555 L1120,605" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="900" y="760" width="440" height="100" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="1120.0" y="795" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">输出层：Logits → 概率 / 选词</text><text x="1120.0" y="828" text-anchor="middle" font-size="18" fill="#334155">逐 Token 生成，直到 &lt;eos&gt;</text><path d="M1120,705 L1120,755" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M480,610 L690,610" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M690,610 L690,505" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M690,505 L895,505" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="665" y="470" text-anchor="middle" font-size="18" fill="#475569">源句信息：生成各层 K、V</text><text x="700" y="910" text-anchor="middle" font-size="18" fill="#475569">Encoder 输出是一组隐藏向量，不是 Attention 权重；Decoder 生成时同时利用目标前缀与源句信息。</text></g></svg>