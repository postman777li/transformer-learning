<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="720" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">03 / 生成逐步扩展前缀；训练将目标右移对齐</text><text x="48" y="94" font-size="18" fill="#475569">左侧为期望生成过程，不代表当前演示代码已经学会翻译；右侧为 Teacher Forcing。</text><rect x="40" y="150" width="350" height="85" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="215.0" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">&lt;bos&gt;</text><path d="M390,190 L450,190" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="150" width="195" height="85" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="562.5" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">我</text><rect x="40" y="265" width="350" height="85" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="215.0" y="300" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">&lt;bos&gt; 我</text><path d="M390,305 L450,305" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="265" width="195" height="85" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="562.5" y="300" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">爱</text><rect x="40" y="380" width="350" height="85" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="215.0" y="415" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">&lt;bos&gt; 我 爱</text><path d="M390,420 L450,420" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="380" width="195" height="85" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="562.5" y="415" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">你</text><rect x="40" y="495" width="350" height="85" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="215.0" y="530" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">&lt;bos&gt; 我 爱 你</text><path d="M390,535 L450,535" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="495" width="195" height="85" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="562.5" y="530" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">&lt;eos&gt;</text><rect x="770" y="160" width="585" height="140" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="1062.5" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">训练输入：真实目标前缀</text><text x="1062.5" y="228" text-anchor="middle" font-size="18" fill="#334155">&lt;bos&gt; / 我 / 爱 / 你</text><text x="1062.5" y="257" text-anchor="middle" font-size="18" fill="#334155">每个位置用因果 Mask 限制可见范围</text><path d="M1060,300 L1060,370" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="375" width="585" height="140" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="1062.5" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">对齐标签：各位置的下一个 Token</text><text x="1062.5" y="443" text-anchor="middle" font-size="18" fill="#334155">我 / 爱 / 你 / &lt;eos&gt;</text><text x="1062.5" y="472" text-anchor="middle" font-size="18" fill="#334155">并行计算 Logits 和 Cross-Entropy Loss</text><text x="700" y="645" text-anchor="middle" font-size="18" fill="#475569">每轮 Decoder 都读取同一源句的 Encoder 表示；生成的新 Token 会加入下一步前缀。</text><text x="700" y="690" text-anchor="middle" font-size="18" fill="#475569">训练可以并行，预测标签不要放在当前可见输入位置，否则会泄漏答案。</text></g></svg>