<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="450" viewBox="0 0 1400 450"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="450" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">03 / 训练：学习的是投影规则 W，不是固定的 Q、K、V</text><text x="48" y="94" font-size="18" fill="#475569">通常没有人为指定的“正确 QKV”；投影参数通过最终任务的损失间接学习。</text><rect x="40" y="155" width="285" height="125" rx="16" fill="#e0f2fe" stroke="#cbd5e1"/><text x="182.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">输入 X + 参数 W</text><text x="182.5" y="223" text-anchor="middle" font-size="18" fill="#334155">计算 Q、K、V</text><rect x="385" y="155" width="285" height="125" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="527.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Attention + 后续网络</text><text x="527.5" y="223" text-anchor="middle" font-size="18" fill="#334155">生成预测结果</text><rect x="730" y="155" width="285" height="125" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="872.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">预测与目标比较</text><text x="872.5" y="223" text-anchor="middle" font-size="18" fill="#334155">计算 Loss</text><rect x="1075" y="155" width="285" height="125" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1217.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">反向传播 + 优化器</text><text x="1217.5" y="223" text-anchor="middle" font-size="18" fill="#334155">计算梯度，更新 W</text><path d="M325,218 L380,218" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M670,218 L725,218" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1015,218 L1070,218" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1217,285 L1217,340 L182,340 L182,285" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="380" text-anchor="middle" font-size="18" fill="#475569">训练：重复更新参数 W。推理：通常固定 W，用新的输入重新计算 Q、K、V。</text></g></svg>