<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="760" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">02 / Self-Attention：Self 指的是同一组输入</text><text x="48" y="94" font-size="18" fill="#475569">以 animal、street、it 为例：每个 Token 生成自己的 Q、K、V；所有位置共享同一套投影参数。</text><rect x="50" y="260" width="250" height="150" rx="16" fill="#e0f2fe" stroke="#cbd5e1"/><text x="175.0" y="295" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">同一输入 X</text><text x="175.0" y="328" text-anchor="middle" font-size="18" fill="#334155">animal / street / it</text><text x="175.0" y="357" text-anchor="middle" font-size="18" fill="#334155">shape: [3,2]</text><rect x="430" y="140" width="300" height="120" rx="16" fill="#e0f2fe" stroke="#cbd5e1"/><text x="580.0" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q = XWq</text><text x="580.0" y="208" text-anchor="middle" font-size="18" fill="#334155">每个位置发起查询</text><path d="M300,335 L375,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M375,335 L375,200" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M375,200 L425,200" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="320" width="300" height="120" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="580.0" y="355" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">K = XWk</text><text x="580.0" y="388" text-anchor="middle" font-size="18" fill="#334155">每个位置提供匹配线索</text><path d="M300,335 L375,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M375,335 L375,380" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M375,380 L425,380" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="500" width="300" height="120" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="580.0" y="535" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">V = XWv</text><text x="580.0" y="568" text-anchor="middle" font-size="18" fill="#334155">每个位置提供汇总内容</text><path d="M300,335 L375,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M375,335 L375,560" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M375,560 L425,560" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="900" y="190" width="440" height="150" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="1120.0" y="225" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">it 的 Q × 全部 K</text><text x="1120.0" y="258" text-anchor="middle" font-size="18" fill="#334155">匹配 animal、street、it</text><text x="1120.0" y="287" text-anchor="middle" font-size="18" fill="#334155">得到 it 对各位置的权重</text><path d="M730,200 L895,240" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M730,380 L810,380" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M810,380 L810,300" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M810,300 L895,300" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="900" y="460" width="440" height="140" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="1120.0" y="495" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">用这组权重汇总全部 V</text><text x="1120.0" y="528" text-anchor="middle" font-size="18" fill="#334155">得到 it 的 Attention 输出</text><text x="1120.0" y="557" text-anchor="middle" font-size="18" fill="#334155">animal、street 也各自计算</text><path d="M1120,340 L1120,455" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M730,560 L895,530" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="695" text-anchor="middle" font-size="18" fill="#475569">Self-Attention：Q、K、V 同源。招聘例子：公司提供 Q，候选人提供 K、V，来源不同。</text></g></svg>