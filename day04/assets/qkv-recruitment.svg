<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="650" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">01 / 招聘例子：匹配看 Q、K，汇总取 V</text><text x="48" y="94" font-size="18" fill="#475569">所有向量与投影均为教学设定；本图暂不做缩放，缩放在 Day 5 学习。</text><rect x="45" y="140" width="300" height="135" rx="16" fill="#e0f2fe" stroke="#cbd5e1"/><text x="195.0" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q：公司的查询</text><text x="195.0" y="208" text-anchor="middle" font-size="18" fill="#334155">公司 [1,1] × Wq</text><text x="195.0" y="237" text-anchor="middle" font-size="18" fill="#334155">Q = [2,1]</text><rect x="45" y="315" width="300" height="150" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="195.0" y="350" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">K：候选人的匹配特征</text><text x="195.0" y="383" text-anchor="middle" font-size="18" fill="#334155">小明 K = [9,1]</text><text x="195.0" y="412" text-anchor="middle" font-size="18" fill="#334155">小红 K = [3,4.5]</text><rect x="470" y="205" width="360" height="175" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="650.0" y="240" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q 与各个 K 点积</text><text x="650.0" y="273" text-anchor="middle" font-size="18" fill="#334155">小明：2×9 + 1×1 = 19</text><text x="650.0" y="302" text-anchor="middle" font-size="18" fill="#334155">小红：2×3 + 1×4.5 = 10.5</text><text x="650.0" y="331" text-anchor="middle" font-size="18" fill="#334155">Softmax → [0.9998, 0.0002]</text><path d="M345,210 L465,250" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M345,380 L465,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="920" y="140" width="430" height="135" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1135.0" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">V：候选人提供的信息</text><text x="1135.0" y="208" text-anchor="middle" font-size="18" fill="#334155">小明 V = [9,2]</text><text x="1135.0" y="237" text-anchor="middle" font-size="18" fill="#334155">小红 V = [3,9]</text><rect x="920" y="340" width="430" height="150" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="1135.0" y="375" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">按权重汇总 V</text><text x="1135.0" y="408" text-anchor="middle" font-size="18" fill="#334155">0.9998 × [9,2] + 0.0002 × [3,9]</text><text x="1135.0" y="437" text-anchor="middle" font-size="18" fill="#334155">输出 ≈ [8.9988, 2.0014]</text><path d="M830,300 L880,300" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M880,300 L880,410" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M880,410 L915,410" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1135,275 L1135,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="565" text-anchor="middle" font-size="18" fill="#475569">Q、K 决定权重；权重用在 V 上。输出是信息的混合，不是某个人的能力。</text><text x="700" y="605" text-anchor="middle" font-size="18" fill="#475569">Wq = diag(2,1)    Wk = diag(1,0.5)    Wv = 单位矩阵</text></g></svg>