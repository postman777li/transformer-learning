<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="650" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">01 / KV Cache：复用旧信息，只处理新 Token</text><text x="48" y="94" font-size="18" fill="#475569">已处理 The young engineer writes，新 Token 确定为 code。</text><text x="700" y="137" text-anchor="middle" font-size="18" fill="#475569">无缓存</text><rect x="50" y="155" width="370" height="140" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="235.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">整个前缀</text><text x="235.0" y="223" text-anchor="middle" font-size="18" fill="#334155">The young engineer writes code</text><path d="M420,225 L510,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="155" width="370" height="140" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="700.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">重复运行各层</text><text x="700.0" y="223" text-anchor="middle" font-size="18" fill="#334155">旧 Token 的计算也重做</text><path d="M885,225 L975,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="155" width="370" height="140" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1165.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">最后位置 Logits</text><text x="1165.0" y="223" text-anchor="middle" font-size="18" fill="#334155">用于选择下一 Token</text><text x="700" y="357" text-anchor="middle" font-size="18" fill="#475569">有缓存</text><rect x="50" y="375" width="370" height="140" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="235.0" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">只输入 code</text><text x="235.0" y="443" text-anchor="middle" font-size="18" fill="#334155">位置编号接着历史长度</text><path d="M420,445 L510,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="375" width="370" height="140" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="700.0" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">各层追加新 K、V</text><text x="700.0" y="443" text-anchor="middle" font-size="18" fill="#334155">新 Q 读取旧+新 K、V</text><path d="M885,445 L975,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="375" width="370" height="140" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1165.0" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">最后位置 Logits</text><text x="1165.0" y="443" text-anchor="middle" font-size="18" fill="#334155">应与完整重算一致</text><text x="700" y="610" text-anchor="middle" font-size="18" fill="#475569">第一次仍要处理完整提示词（Prefill）；后续才是逐 Token 的增量 Decode。</text></g></svg>