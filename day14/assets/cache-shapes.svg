<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="480" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">02 / 每一层分别保存自己的 K、V</text><text x="48" y="94" font-size="18" fill="#475569">本例 B=1，H=4，D=32；初始前缀长度 4。</text><rect x="40" y="155" width="285" height="155" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="182.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">旧缓存</text><text x="182.5" y="223" text-anchor="middle" font-size="18" fill="#334155">K/V 各 [1,4,4,32]</text><path d="M325,230 L380,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="155" width="285" height="155" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="527.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">新 Token 投影</text><text x="527.5" y="223" text-anchor="middle" font-size="18" fill="#334155">Q/K/V 各 [1,4,1,32]</text><path d="M670,230 L725,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="730" y="155" width="285" height="155" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="872.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">追加 K、V</text><text x="872.5" y="223" text-anchor="middle" font-size="18" fill="#334155">各 [1,4,5,32]</text><text x="872.5" y="252" text-anchor="middle" font-size="18" fill="#334155">注意力分数 [1,4,1,5]</text><path d="M1015,230 L1070,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1075" y="155" width="285" height="155" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1217.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">新位置输出</text><text x="1217.5" y="223" text-anchor="middle" font-size="18" fill="#334155">[1,1,128]</text><text x="1217.5" y="252" text-anchor="middle" font-size="18" fill="#334155">新缓存交给下一步</text><text x="700" y="385" text-anchor="middle" font-size="18" fill="#475569">缓存减少重复计算，不让自回归变成并行生成；每一步仍需读取历史 Key/Value。</text></g></svg>