<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="630" viewBox="0 0 1400 630"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="630" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">03 / Concat 负责排在一起，Wo 负责学习组合</text><text x="48" y="94" font-size="18" fill="#475569">下面用 2 个 Head 的小向量演示，数值与矩阵均为人为指定；不是上图 512 维配置的实际输出。</text><rect x="50" y="160" width="280" height="115" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="190.0" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Head 1</text><text x="190.0" y="228" text-anchor="middle" font-size="18" fill="#334155">[2,1]</text><rect x="50" y="340" width="280" height="115" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="190.0" y="375" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Head 2</text><text x="190.0" y="408" text-anchor="middle" font-size="18" fill="#334155">[0,3]</text><rect x="500" y="245" width="370" height="135" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="685.0" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Concat → [2,1,0,3]</text><text x="685.0" y="313" text-anchor="middle" font-size="18" fill="#334155">沿特征维度拼接</text><text x="685.0" y="342" text-anchor="middle" font-size="18" fill="#334155">无参数，不求和或平均</text><path d="M330,220 L495,280" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M330,395 L495,345" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1020" y="245" width="330" height="135" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="1185.0" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">乘 Wo → [2,4]</text><text x="1185.0" y="313" text-anchor="middle" font-size="18" fill="#334155">输出第 1 维：2+0</text><text x="1185.0" y="342" text-anchor="middle" font-size="18" fill="#334155">输出第 2 维：1+3</text><path d="M870,310 L1015,310" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="510" text-anchor="middle" font-size="18" fill="#475569">本例 Wo = [[1,0], [0,1], [1,0], [0,1]]，shape 为 [4,2]。</text><text x="700" y="560" text-anchor="middle" font-size="18" fill="#475569">标准 8×64 配置：Concat 得到 512 维，Wo 通常将 512 维映射回 512 维。</text></g></svg>