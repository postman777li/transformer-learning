<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="650" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">01 / 同一个 code，可以有不同的关注方式</text><text x="48" y="94" font-size="18" fill="#475569">The young engineer writes code and solves difficult problems daily.</text><rect x="45" y="245" width="260" height="140" rx="16" fill="#e0f2fe" stroke="#cbd5e1"/><text x="175.0" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">同一组输入 X</text><text x="175.0" y="313" text-anchor="middle" font-size="18" fill="#334155">每个 Head 都看同一句话</text><text x="175.0" y="342" text-anchor="middle" font-size="18" fill="#334155">特征投影参数不同</text><rect x="460" y="135" width="385" height="115" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="652.5" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Head 1：一种投影视角</text><text x="652.5" y="203" text-anchor="middle" font-size="18" fill="#334155">code ↔ writes</text><text x="652.5" y="232" text-anchor="middle" font-size="18" fill="#334155">例如：动作与对象</text><path d="M305,315 L380,315" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M380,315 L380,185" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M380,185 L455,185" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="460" y="320" width="385" height="115" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="652.5" y="355" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Head 2：另一种投影视角</text><text x="652.5" y="388" text-anchor="middle" font-size="18" fill="#334155">code ↔ engineer</text><text x="652.5" y="417" text-anchor="middle" font-size="18" fill="#334155">例如：人物与工作</text><path d="M305,315 L380,315" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M380,315 L380,370" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M380,370 L455,370" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="460" y="505" width="385" height="115" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="652.5" y="540" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">其他 Head</text><text x="652.5" y="573" text-anchor="middle" font-size="18" fill="#334155">其他上下文关联</text><path d="M305,315 L380,315" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M380,315 L380,555" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M380,555 L455,555" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1000" y="260" width="345" height="140" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="1172.5" y="295" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">多组注意力结果</text><text x="1172.5" y="328" text-anchor="middle" font-size="18" fill="#334155">Concat 保留各组特征</text><text x="1172.5" y="357" text-anchor="middle" font-size="18" fill="#334155">Wo 学习如何组合</text><path d="M845,190 L995,290" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M845,375 L995,340" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M845,555 L995,380" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="635" text-anchor="middle" font-size="18" fill="#475569">分工仅为理解示意：实际由训练学习，不保证每个 Head 都有可解释的专长。</text></g></svg>