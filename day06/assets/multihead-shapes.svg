<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="720" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">02 / 8 个 Head：投影后拆特征，不是把句子切成 8 段</text><text x="48" y="94" font-size="18" fill="#475569">B=2 条序列，T=10 个位置，C=512 维，H=8 个 Head，D=C/H=64。</text><rect x="40" y="155" width="285" height="150" rx="16" fill="#e0f2fe" stroke="#cbd5e1"/><text x="182.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">输入 X</text><text x="182.5" y="223" text-anchor="middle" font-size="18" fill="#334155">[2,10,512]</text><rect x="385" y="155" width="285" height="150" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="527.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q、K、V 投影</text><text x="527.5" y="223" text-anchor="middle" font-size="18" fill="#334155">各 [2,10,512]</text><text x="527.5" y="252" text-anchor="middle" font-size="18" fill="#334155">每个 Head 使用全输入特征</text><rect x="730" y="155" width="285" height="150" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="872.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">拆分 + 调整轴</text><text x="872.5" y="223" text-anchor="middle" font-size="18" fill="#334155">各 [2,8,10,64]</text><text x="872.5" y="252" text-anchor="middle" font-size="18" fill="#334155">每个 Head 仍有 10 个位置</text><rect x="1075" y="155" width="285" height="150" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="1217.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q @ Kᵀ</text><text x="1217.5" y="223" text-anchor="middle" font-size="18" fill="#334155">分数 [2,8,10,10]</text><text x="1217.5" y="252" text-anchor="middle" font-size="18" fill="#334155">每头一张 10×10 表</text><path d="M325,230 L380,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M670,230 L725,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1015,230 L1070,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1215,305 L1215,395" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="920" y="400" width="420" height="125" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="1130.0" y="435" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">除以 √64=8，再逐行 Softmax</text><text x="1130.0" y="468" text-anchor="middle" font-size="18" fill="#334155">权重 [2,8,10,10]</text><rect x="455" y="400" width="365" height="125" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="637.5" y="435" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">权重 @ V</text><text x="637.5" y="468" text-anchor="middle" font-size="18" fill="#334155">每头输出 [2,8,10,64]</text><path d="M920,460 L825,460" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="400" width="310" height="125" rx="16" fill="#e0f2fe" stroke="#cbd5e1"/><text x="200.0" y="435" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">合并 Head + Wo</text><text x="200.0" y="468" text-anchor="middle" font-size="18" fill="#334155">最终 [2,10,512]</text><path d="M455,460 L360,460" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="600" text-anchor="middle" font-size="18" fill="#475569">先 [B,T,C] → [B,T,H,D]，再 transpose → [B,H,T,D]。</text><text x="700" y="645" text-anchor="middle" font-size="18" fill="#475569">B 的两句话各自计算，不跨样本互相关注；每个 Head 的缩放维度是 D=64。</text></g></svg>