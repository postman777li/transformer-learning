<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="480" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">01 / GPT：一条序列，持续预测下一词</text><text x="48" y="94" font-size="18" fill="#475569">前缀 The young engineer writes → 预测 code → 把 code 加入前缀。</text><rect x="40" y="155" width="285" height="155" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="182.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Token IDs</text><text x="182.5" y="223" text-anchor="middle" font-size="18" fill="#334155">[B,T]</text><path d="M325,230 L380,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="155" width="285" height="155" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="527.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">内容 + 位置向量</text><text x="527.5" y="223" text-anchor="middle" font-size="18" fill="#334155">[B,T,512]</text><path d="M670,230 L725,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="730" y="155" width="285" height="155" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="872.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">因果 Block × 4</text><text x="872.5" y="223" text-anchor="middle" font-size="18" fill="#334155">保持 [B,T,512]</text><path d="M1015,230 L1070,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1075" y="155" width="285" height="155" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1217.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">LM Head → Logits</text><text x="1217.5" y="223" text-anchor="middle" font-size="18" fill="#334155">[B,T,V]</text><text x="1217.5" y="252" text-anchor="middle" font-size="18" fill="#334155">取最后位置选下一 Token</text><text x="700" y="385" text-anchor="middle" font-size="18" fill="#475569">Logits 是词表上的分数；随机初始化模型的预测并不代表学会了语言。</text></g></svg>