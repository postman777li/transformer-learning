<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="650" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">02 / 从 Encoder–Decoder 到 Decoder-only</text><text x="48" y="94" font-size="18" fill="#475569">两者都可以自回归生成；GPT 不需要独立的源句编码分支。</text><text x="700" y="137" text-anchor="middle" font-size="18" fill="#475569">Encoder–Decoder</text><rect x="50" y="155" width="370" height="140" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="235.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">源序列</text><text x="235.0" y="223" text-anchor="middle" font-size="18" fill="#334155">独立 Encoder</text><path d="M420,225 L510,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="155" width="370" height="140" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="700.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">目标前缀</text><text x="700.0" y="223" text-anchor="middle" font-size="18" fill="#334155">Self-Attention + Cross-Attention</text><path d="M885,225 L975,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="155" width="370" height="140" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1165.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">下一个目标 Token</text><text x="1165.0" y="223" text-anchor="middle" font-size="18" fill="#334155">同时利用源句和目标前缀</text><text x="700" y="357" text-anchor="middle" font-size="18" fill="#475569">GPT Decoder-only</text><rect x="50" y="375" width="370" height="140" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="235.0" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">提示词 + 已生成内容</text><text x="235.0" y="443" text-anchor="middle" font-size="18" fill="#334155">同一条序列</text><path d="M420,445 L510,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="375" width="370" height="140" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="700.0" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">因果 Self-Attention</text><text x="700.0" y="443" text-anchor="middle" font-size="18" fill="#334155">没有独立 Cross-Attention</text><path d="M885,445 L975,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="375" width="370" height="140" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1165.0" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">下一个 Token</text><text x="1165.0" y="443" text-anchor="middle" font-size="18" fill="#334155">继续追加到同一序列</text><text x="700" y="610" text-anchor="middle" font-size="18" fill="#475569">这里比较基础文本架构，不表示所有现代变体都具有相同组件。</text></g></svg>