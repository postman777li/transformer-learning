<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="600" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">01 / FFN：各 Token 独立加工，使用同一套参数</text><text x="48" y="94" font-size="18" fill="#475569">Attention 负责跨位置交换信息；FFN 继续对每个位置的特征做非线性变换。</text><rect x="40" y="160" width="285" height="125" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="182.5" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">输入 engineer</text><text x="182.5" y="228" text-anchor="middle" font-size="18" fill="#334155">4 维特征</text><rect x="385" y="160" width="285" height="125" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="527.5" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Linear：4 → 8</text><text x="527.5" y="228" text-anchor="middle" font-size="18" fill="#334155">组合出中间特征</text><rect x="730" y="160" width="285" height="125" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="872.5" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">ReLU</text><text x="872.5" y="228" text-anchor="middle" font-size="18" fill="#334155">加入非线性</text><rect x="1075" y="160" width="285" height="125" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1217.5" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Linear：8 → 4</text><text x="1217.5" y="228" text-anchor="middle" font-size="18" fill="#334155">恢复原维度</text><path d="M325,225 L380,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M670,225 L725,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1015,225 L1070,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="355" width="1100" height="125" rx="16" fill="#ffffff" stroke="#cbd5e1"/><text x="700.0" y="390" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">批量执行：形状中的 B 和 T 不改变</text><text x="700.0" y="423" text-anchor="middle" font-size="18" fill="#334155">教学示例 [2,10,4] → [2,10,8] → [2,10,4]</text><text x="700.0" y="452" text-anchor="middle" font-size="18" fill="#334155">本次代码 [2,10,512] → [2,10,2048] → [2,10,512]</text><text x="700" y="550" text-anchor="middle" font-size="18" fill="#475569">同一套 FFN 分别处理 engineer、writes、code 等位置；不在 FFN 内直接混合 Token。</text></g></svg>