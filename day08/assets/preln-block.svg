<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="880" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">03 / Pre-LN Block：两次归一化，两条残差路径</text><text x="48" y="94" font-size="18" fill="#475569">与本次代码一致：先 LayerNorm，再计算子层，最后加回对应输入。所有主干表示保持 [B,T,C]。</text><rect x="140" y="140" width="440" height="90" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="360.0" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">输入 X</text><text x="360.0" y="208" text-anchor="middle" font-size="18" fill="#334155">[2,10,512]</text><rect x="140" y="295" width="440" height="90" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="360.0" y="330" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">LayerNorm 1</text><text x="360.0" y="363" text-anchor="middle" font-size="18" fill="#334155">先规范化特征</text><path d="M360,230 L360,290" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="140" y="450" width="440" height="100" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="360.0" y="485" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Causal Self-Attention</text><text x="360.0" y="518" text-anchor="middle" font-size="18" fill="#334155">输出仍为 [2,10,512]</text><path d="M360,385 L360,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="360" cy="635" r="28" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="360" y="644" text-anchor="middle" font-size="28" fill="#0f172a">+</text><path d="M360,550 L360,602" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M140,185 L75,185 L75,635 L327,635" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="140" y="730" width="440" height="90" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="360.0" y="765" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">得到 H</text><text x="360.0" y="798" text-anchor="middle" font-size="18" fill="#334155">X + Attention(LN1(X))</text><path d="M360,663 L360,725" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="840" y="140" width="440" height="90" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1060.0" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">中间结果 H</text><text x="1060.0" y="208" text-anchor="middle" font-size="18" fill="#334155">[2,10,512]</text><rect x="840" y="295" width="440" height="90" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="1060.0" y="330" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">LayerNorm 2</text><text x="1060.0" y="363" text-anchor="middle" font-size="18" fill="#334155">先规范化特征</text><path d="M1060,230 L1060,290" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="840" y="450" width="440" height="100" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="1060.0" y="485" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">FFN：512 → 2048 → 512</text><text x="1060.0" y="518" text-anchor="middle" font-size="18" fill="#334155">输出仍为 [2,10,512]</text><path d="M1060,385 L1060,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="1060" cy="635" r="28" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="1060" y="644" text-anchor="middle" font-size="28" fill="#0f172a">+</text><path d="M1060,550 L1060,602" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M840,185 L775,185 L775,635 L1027,635" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="840" y="730" width="440" height="90" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1060.0" y="765" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">得到 Y</text><text x="1060.0" y="798" text-anchor="middle" font-size="18" fill="#334155">H + FFN(LN2(H))</text><path d="M1060,663 L1060,725" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M580,775 L700,775" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M700,775 L700,185" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M700,185 L835,185" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="860" text-anchor="middle" font-size="18" fill="#475569">第一次加回 X，第二次加回 H。Pre-LN 不是先归一化整条残差主干。</text></g></svg>