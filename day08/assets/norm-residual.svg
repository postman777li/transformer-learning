<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="680" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">02 / LayerNorm 管尺度，Residual 留直接路径</text><text x="48" y="94" font-size="18" fill="#475569">下面是两个独立的数字示例，用来区分归一化与残差相加。</text><rect x="50" y="150" width="600" height="130" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="350.0" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">LayerNorm：每个 Token 自己归一化</text><text x="350.0" y="218" text-anchor="middle" font-size="18" fill="#334155">x = [2,0,4,2]</text><text x="350.0" y="247" text-anchor="middle" font-size="18" fill="#334155">均值 μ=2，方差 v=2</text><path d="M350,280 L350,330" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="335" width="600" height="140" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="350.0" y="370" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">(x−μ) / √(v+ε)</text><text x="350.0" y="403" text-anchor="middle" font-size="18" fill="#334155">忽略 ε：[0,−1.414,1.414,0]</text><text x="350.0" y="432" text-anchor="middle" font-size="18" fill="#334155">之后再乘可学习 γ，并加 β</text><rect x="750" y="150" width="600" height="130" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1050.0" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Residual：保留原输入并叠加调整</text><text x="1050.0" y="218" text-anchor="middle" font-size="18" fill="#334155">x = [1,2,3,4]</text><text x="1050.0" y="247" text-anchor="middle" font-size="18" fill="#334155">F(x) = [0.1,−0.2,0.5,0.3]</text><path d="M1050,280 L1050,330" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="750" y="335" width="600" height="140" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="1050.0" y="370" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">y = x + F(x)</text><text x="1050.0" y="403" text-anchor="middle" font-size="18" fill="#334155">y = [1.1,1.8,3.5,4.3]</text><text x="1050.0" y="432" text-anchor="middle" font-size="18" fill="#334155">两份表示形状相同，逐元素相加</text><text x="700" y="550" text-anchor="middle" font-size="18" fill="#475569">LayerNorm(C)：沿最后的 C 个特征归一化，不跨 Token 或 Batch 统计。</text><text x="700" y="600" text-anchor="middle" font-size="18" fill="#475569">归一化后经 γ、β 调整，最终结果不必均值为 0、方差为 1；残差也不保证梯度永不消失。</text></g></svg>