<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="570" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">02 / GQA：8 个 Query Head，共享 2 组 K/V</text><text x="48" y="94" font-size="18" fill="#475569">各个 Query Head 的查询仍然不同；同组复用同一份 K/V 投影。</text><rect x="40" y="155" width="145" height="90" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="112.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q1</text><path d="M112,245 L345,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="210" y="155" width="145" height="90" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="282.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q2</text><path d="M282,245 L345,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="380" y="155" width="145" height="90" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="452.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q3</text><path d="M452,245 L345,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="550" y="155" width="145" height="90" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="622.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q4</text><path d="M622,245 L345,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="720" y="155" width="145" height="90" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="792.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q5</text><path d="M792,245 L1055,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="890" y="155" width="145" height="90" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="962.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q6</text><path d="M962,245 L1055,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1060" y="155" width="145" height="90" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="1132.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q7</text><path d="M1132,245 L1055,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1230" y="155" width="145" height="90" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="1302.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q8</text><path d="M1302,245 L1055,335" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="345" width="600" height="100" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="350.0" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">K/V Head 1</text><text x="350.0" y="413" text-anchor="middle" font-size="18" fill="#334155">供 Q1、Q2、Q3、Q4 使用</text><rect x="750" y="345" width="600" height="100" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="1050.0" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">K/V Head 2</text><text x="1050.0" y="413" text-anchor="middle" font-size="18" fill="#334155">供 Q5、Q6、Q7、Q8 使用</text><text x="700" y="505" text-anchor="middle" font-size="18" fill="#475569">Q：[2,8,10,16]；K/V：[2,2,10,16]。存储的 K/V 头数比普通 8 头 MHA 少 4 倍。</text><text x="700" y="550" text-anchor="middle" font-size="18" fill="#475569">教学代码用 repeat_interleave 展开 K/V，可能物化临时副本；实际内存收益取决于实现。</text></g></svg>