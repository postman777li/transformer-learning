<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="650" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">02 / Teacher Forcing 与损失对齐</text><text x="48" y="94" font-size="18" fill="#475569">训练时使用真实前缀，因果 Mask 防止读取未来答案。</text><text x="700" y="137" text-anchor="middle" font-size="18" fill="#475569">正确对齐</text><rect x="50" y="155" width="370" height="140" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="235.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">输入</text><text x="235.0" y="223" text-anchor="middle" font-size="18" fill="#334155">The / young / engineer</text><path d="M420,225 L510,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="155" width="370" height="140" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="700.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">各位置预测</text><text x="700.0" y="223" text-anchor="middle" font-size="18" fill="#334155">下一个词的分布</text><path d="M885,225 L975,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="155" width="370" height="140" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1165.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">标签</text><text x="1165.0" y="223" text-anchor="middle" font-size="18" fill="#334155">young / engineer / writes</text><text x="700" y="357" text-anchor="middle" font-size="18" fill="#475569">计算所有位置损失</text><rect x="50" y="375" width="370" height="140" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="235.0" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Logits</text><text x="235.0" y="443" text-anchor="middle" font-size="18" fill="#334155">[B,T,V] → [B*T,V]</text><path d="M420,445 L510,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="375" width="370" height="140" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="700.0" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Cross-Entropy</text><text x="700.0" y="443" text-anchor="middle" font-size="18" fill="#334155">直接接收原始 Logits</text><path d="M885,445 L975,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="375" width="370" height="140" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1165.0" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">目标 ID</text><text x="1165.0" y="443" text-anchor="middle" font-size="18" fill="#334155">[B,T] → [B*T]</text><text x="700" y="610" text-anchor="middle" font-size="18" fill="#475569">不要把输入原样当标签；训练批次上的 Loss 下降不能证明对新文本的泛化能力。</text></g></svg>