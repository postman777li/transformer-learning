<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="480" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">01 / 训练：预测、算错、求梯度、更新</text><text x="48" y="94" font-size="18" fill="#475569">输入 The young engineer writes；目标 young engineer writes code，错开一个 Token。</text><rect x="40" y="155" width="285" height="155" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="182.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">前向传播</text><text x="182.5" y="223" text-anchor="middle" font-size="18" fill="#334155">输入 [B,T]</text><text x="182.5" y="252" text-anchor="middle" font-size="18" fill="#334155">Logits [B,T,V]</text><path d="M325,230 L380,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="155" width="285" height="155" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="527.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Cross-Entropy</text><text x="527.5" y="223" text-anchor="middle" font-size="18" fill="#334155">正确 Token 的 ID</text><text x="527.5" y="252" text-anchor="middle" font-size="18" fill="#334155">损失是标量</text><path d="M670,230 L725,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="730" y="155" width="285" height="155" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="872.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">loss.backward()</text><text x="872.5" y="223" text-anchor="middle" font-size="18" fill="#334155">计算参数梯度</text><text x="872.5" y="252" text-anchor="middle" font-size="18" fill="#334155">尚未更新参数</text><path d="M1015,230 L1070,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1075" y="155" width="285" height="155" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1217.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">optimizer.step()</text><text x="1217.5" y="223" text-anchor="middle" font-size="18" fill="#334155">AdamW 更新参数</text><text x="1217.5" y="252" text-anchor="middle" font-size="18" fill="#334155">下一批前先清空梯度</text><text x="700" y="385" text-anchor="middle" font-size="18" fill="#475569">本脚本名为 epochs 的循环实际每次只抽取一个随机 Batch，约等于 300 个训练步骤。</text></g></svg>