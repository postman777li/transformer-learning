<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="480" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">01 / 生成：选一个词，再追加，再算</text><text x="48" y="94" font-size="18" fill="#475569">前缀 The young engineer writes → 选择 code → 新前缀继续预测。</text><rect x="40" y="155" width="285" height="155" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="182.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">模型前向</text><text x="182.5" y="223" text-anchor="middle" font-size="18" fill="#334155">model.eval()</text><text x="182.5" y="252" text-anchor="middle" font-size="18" fill="#334155">关闭梯度记录</text><path d="M325,230 L380,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="155" width="285" height="155" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="527.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">最后位置 Logits</text><text x="527.5" y="223" text-anchor="middle" font-size="18" fill="#334155">[B,V]</text><text x="527.5" y="252" text-anchor="middle" font-size="18" fill="#334155">除以 temperature</text><path d="M670,230 L725,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="730" y="155" width="285" height="155" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="872.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">筛选 + 选择</text><text x="872.5" y="223" text-anchor="middle" font-size="18" fill="#334155">Top-k / Top-p</text><text x="872.5" y="252" text-anchor="middle" font-size="18" fill="#334155">采样或 argmax</text><path d="M1015,230 L1070,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1075" y="155" width="285" height="155" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1217.5" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">追加 Token</text><text x="1217.5" y="223" text-anchor="middle" font-size="18" fill="#334155">序列长度 +1</text><text x="1217.5" y="252" text-anchor="middle" font-size="18" fill="#334155">EOS 或长度上限停止</text><text x="700" y="385" text-anchor="middle" font-size="18" fill="#475569">当前实现超出 max_len 会截取末尾窗口，并重新使用从 0 开始的学习位置编号。</text></g></svg>