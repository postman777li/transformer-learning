<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="650" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">02 / Top-k 与 Top-p：候选范围怎么选？</text><text x="48" y="94" font-size="18" fill="#475569">假设已排序概率为 [0.50,0.25,0.15,0.10]；两种规则都在筛选后重新归一化。</text><text x="700" y="137" text-anchor="middle" font-size="18" fill="#475569">Top-k = 2</text><rect x="50" y="155" width="370" height="140" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="235.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">按分数排序</text><text x="235.0" y="223" text-anchor="middle" font-size="18" fill="#334155">A 0.50 / B 0.25</text><text x="235.0" y="252" text-anchor="middle" font-size="18" fill="#334155">C 0.15 / D 0.10</text><path d="M420,225 L510,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="155" width="370" height="140" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="700.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">只保留前 2 个</text><text x="700.0" y="223" text-anchor="middle" font-size="18" fill="#334155">保留 A、B</text><path d="M885,225 L975,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="155" width="370" height="140" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1165.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">重新归一化</text><text x="1165.0" y="223" text-anchor="middle" font-size="18" fill="#334155">A ≈ 0.667</text><text x="1165.0" y="252" text-anchor="middle" font-size="18" fill="#334155">B ≈ 0.333</text><text x="700" y="357" text-anchor="middle" font-size="18" fill="#475569">Top-p = 0.80</text><rect x="50" y="375" width="370" height="140" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="235.0" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">累计概率</text><text x="235.0" y="443" text-anchor="middle" font-size="18" fill="#334155">0.50 → 0.75 → 0.90</text><path d="M420,445 L510,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="375" width="370" height="140" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="700.0" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">保留跨过阈值的候选</text><text x="700.0" y="443" text-anchor="middle" font-size="18" fill="#334155">保留 A、B、C</text><path d="M885,445 L975,445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="980" y="375" width="370" height="140" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1165.0" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">重新归一化</text><text x="1165.0" y="443" text-anchor="middle" font-size="18" fill="#334155">约 [0.556,0.278,0.167]</text><text x="700" y="610" text-anchor="middle" font-size="18" fill="#475569">代码同时启用两者时，先 Top-k 再 Top-p；后者作用于已筛选后的概率。</text></g></svg>