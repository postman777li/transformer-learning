<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="800" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">03 / 矩阵化 Attention：每行是一个 Query，每列是一个 Key</text><text x="48" y="94" font-size="18" fill="#475569">示例：3 个 Token，Q/K 各 2 维，V 也取 2 维；Softmax 沿 Key 方向（每行）计算。</text><rect x="45" y="145" width="260" height="125" rx="16" fill="#e0f2fe" stroke="#cbd5e1"/><text x="175.0" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Q [3,2]</text><text x="175.0" y="213" text-anchor="middle" font-size="18" fill="#334155">3 个查询</text><rect x="45" y="320" width="260" height="125" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="175.0" y="355" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Kᵀ [2,3]</text><text x="175.0" y="388" text-anchor="middle" font-size="18" fill="#334155">3 个 Key 变成 3 列</text><path d="M305,205 L425,205" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M305,380 L425,250" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="175" width="430" height="90" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="645.0" y="210" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">分数 / 权重 [3,3]</text><text x="530" y="300" text-anchor="middle" font-size="18" fill="#475569">animal K</text><text x="645" y="300" text-anchor="middle" font-size="18" fill="#475569">street K</text><text x="760" y="300" text-anchor="middle" font-size="18" fill="#475569">it K</text><text x="400" y="345" text-anchor="middle" font-size="18" fill="#475569">animal Q</text><rect x="475" y="315" width="110" height="50" rx="6" fill="#dbeafe"/><text x="530" y="347" text-anchor="middle" font-size="18" fill="#475569">w11</text><rect x="590" y="315" width="110" height="50" rx="6" fill="#dbeafe"/><text x="645" y="347" text-anchor="middle" font-size="18" fill="#475569">w12</text><rect x="705" y="315" width="110" height="50" rx="6" fill="#dbeafe"/><text x="760" y="347" text-anchor="middle" font-size="18" fill="#475569">w13</text><text x="400" y="402" text-anchor="middle" font-size="18" fill="#475569">street Q</text><rect x="475" y="372" width="110" height="50" rx="6" fill="#ede9fe"/><text x="530" y="404" text-anchor="middle" font-size="18" fill="#475569">w21</text><rect x="590" y="372" width="110" height="50" rx="6" fill="#ede9fe"/><text x="645" y="404" text-anchor="middle" font-size="18" fill="#475569">w22</text><rect x="705" y="372" width="110" height="50" rx="6" fill="#ede9fe"/><text x="760" y="404" text-anchor="middle" font-size="18" fill="#475569">w23</text><text x="400" y="459" text-anchor="middle" font-size="18" fill="#475569">it Q</text><rect x="475" y="429" width="110" height="50" rx="6" fill="#dcfce7"/><text x="530" y="461" text-anchor="middle" font-size="18" fill="#475569">w31</text><rect x="590" y="429" width="110" height="50" rx="6" fill="#dcfce7"/><text x="645" y="461" text-anchor="middle" font-size="18" fill="#475569">w32</text><rect x="705" y="429" width="110" height="50" rx="6" fill="#dcfce7"/><text x="760" y="461" text-anchor="middle" font-size="18" fill="#475569">w33</text><text x="650" y="515" text-anchor="middle" font-size="18" fill="#475569">每行独立 Softmax → 每行权重之和为 1</text><rect x="990" y="190" width="350" height="125" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1165.0" y="225" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">V [3,2]</text><text x="1165.0" y="258" text-anchor="middle" font-size="18" fill="#334155">每个 Key 对应一份 V</text><rect x="990" y="415" width="350" height="125" rx="16" fill="#e0f2fe" stroke="#cbd5e1"/><text x="1165.0" y="450" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">输出 [3,2]</text><text x="1165.0" y="483" text-anchor="middle" font-size="18" fill="#334155">每个 Query 得到一个 2 维向量</text><path d="M860,390 L930,390" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M930,390 L930,480" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M930,480 L985,480" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1165,315 L1165,410" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="630" text-anchor="middle" font-size="18" fill="#475569">[3,2] @ [2,3] → [3,3]；缩放与 Softmax 不改变 shape；[3,3] @ [3,2] → [3,2]</text><text x="700" y="685" text-anchor="middle" font-size="18" fill="#475569">通用规则：Q [Tq,dk]、K [Tk,dk]、V [Tk,dv] → 权重 [Tq,Tk] → 输出 [Tq,dv]</text><text x="700" y="735" text-anchor="middle" font-size="18" fill="#475569">有批量维度时，只转置 K 的最后两维：K.transpose(-2,-1)。</text></g></svg>