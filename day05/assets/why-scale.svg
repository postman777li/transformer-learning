<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="620" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">01 / 为什么缩放：分数差距越大，Softmax 越容易偏向一方</text><text x="48" y="94" font-size="18" fill="#475569">下图比较同一组分数放大前后；缩放控制的是输入尺度，不会保证权重均匀。</text><rect x="45" y="150" width="290" height="130" rx="16" fill="#e0f2fe" stroke="#cbd5e1"/><text x="190.0" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">原始分数</text><text x="190.0" y="218" text-anchor="middle" font-size="18" fill="#334155">[2, 1]</text><path d="M335,215 L440,215" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="470" y="170" width="628.7103776218042" height="54" rx="8" fill="#2563eb"/><rect x="1098.7103776218041" y="170" width="231.2896223781958" height="54" fill="#f59e0b"/><text x="900" y="260" text-anchor="middle" font-size="18" fill="#475569">小明 73.1059%   /   小红 26.8941%</text><rect x="45" y="325" width="290" height="130" rx="16" fill="#e0f2fe" stroke="#cbd5e1"/><text x="190.0" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">分数放大 10 倍</text><text x="190.0" y="393" text-anchor="middle" font-size="18" fill="#334155">[20, 10]</text><path d="M335,390 L440,390" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="470" y="345" width="859.9609578329159" height="54" rx="8" fill="#2563eb"/><rect x="1329.960957832916" y="345" width="0.03904216708405572" height="54" fill="#f59e0b"/><text x="900" y="435" text-anchor="middle" font-size="18" fill="#475569">小明 99.9955%   /   小红 0.0045%</text><text x="700" y="515" text-anchor="middle" font-size="18" fill="#475569">差距从 1 变成 10，