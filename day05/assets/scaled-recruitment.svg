<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="520" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">02 / 招聘例子：同一组 Q、K、V，加上缩放</text><text x="48" y="94" font-size="18" fill="#475569">Q = [2,1]   K = [[9,1],[3,4.5]]   V = [[9,2],[3,9]]；Key 维度 d_k = 2。</text><rect x="40" y="160" width="285" height="130" rx="16" fill="#e0f2fe" stroke="#cbd5e1"/><text x="182.5" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">① 匹配 QKᵀ</text><text x="182.5" y="228" text-anchor="middle" font-size="18" fill="#334155">[19, 10.5]</text><rect x="385" y="160" width="285" height="130" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="527.5" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">② 除以 √2</text><text x="527.5" y="228" text-anchor="middle" font-size="18" fill="#334155">[13.4350, 7.4246]</text><rect x="730" y="160" width="285" height="130" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="872.5" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">③ Softmax</text><text x="872.5" y="228" text-anchor="middle" font-size="18" fill="#334155">[0.997553, 0.002447]</text><rect x="1075" y="160" width="285" height="130" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1217.5" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">④ 加权汇总 V</text><text x="1217.5" y="228" text-anchor="middle" font-size="18" fill="#334155">[8.9853, 2.0171]</text><path d="M325,225 L380,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M670,225 L725,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1015,225 L1070,225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="340" width="1060" height="115" rx="16" fill="#ffffff" stroke="#cbd5e1"/><text x="700.0" y="375" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">缩放后仍然明显偏向小明</text><text x="700.0" y="408" text-anchor="middle" font-size="18" fill="#334155">缩放不把分数限制到 0～1；只有 Softmax 才将它们转换为总和为 1 的权重。</text></g></svg>