<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="720" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">02 / 因果掩码：行是 Query，列是 Key</text><text x="48" y="94" font-size="18" fill="#475569">蓝色允许关注；灰色禁止关注。图中用 4 个位置说明，实际可扩展到任意序列长度。</text><text x="385" y="160" text-anchor="middle" font-size="18" fill="#475569">The</text><text x="515" y="160" text-anchor="middle" font-size="18" fill="#475569">young</text><text x="645" y="160" text-anchor="middle" font-size="18" fill="#475569">engineer</text><text x="775" y="160" text-anchor="middle" font-size="18" fill="#475569">writes</text><text x="210" y="222" text-anchor="middle" font-size="18" fill="#475569">The Q</text><rect x="325" y="185" width="120" height="78" rx="10" fill="#dbeafe"/><text x="385" y="233" text-anchor="middle" font-size="18" fill="#475569">允许</text><rect x="455" y="185" width="120" height="78" rx="10" fill="#e2e8f0"/><text x="515" y="233" text-anchor="middle" font-size="18" fill="#475569">屏蔽</text><rect x="585" y="185" width="120" height="78" rx="10" fill="#e2e8f0"/><text x="645" y="233" text-anchor="middle" font-size="18" fill="#475569">屏蔽</text><rect x="715" y="185" width="120" height="78" rx="10" fill="#e2e8f0"/><text x="775" y="233" text-anchor="middle" font-size="18" fill="#475569">屏蔽</text><text x="210" y="312" text-anchor="middle" font-size="18" fill="#475569">young Q</text><rect x="325" y="275" width="120" height="78" rx="10" fill="#dbeafe"/><text x="385" y="323" text-anchor="middle" font-size="18" fill="#475569">允许</text><rect x="455" y="275" width="120" height="78" rx="10" fill="#dbeafe"/><text x="515" y="323" text-anchor="middle" font-size="18" fill="#475569">允许</text><rect x="585" y="275" width="120" height="78" rx="10" fill="#e2e8f0"/><text x="645" y="323" text-anchor="middle" font-size="18" fill="#475569">屏蔽</text><rect x="715" y="275" width="120" height="78" rx="10" fill="#e2e8f0"/><text x="775" y="323" text-anchor="middle" font-size="18" fill="#475569">屏蔽</text><text x="210" y="402" text-anchor="middle" font-size="18" fill="#475569">engineer Q</text><rect x="325" y="365" width="120" height="78" rx="10" fill="#dbeafe"/><text x="385" y="413" text-anchor="middle" font-size="18" fill="#475569">允许</text><rect x="455" y="365" width="120" height="78" rx="10" fill="#dbeafe"/><text x="515" y="413" text-anchor="middle" font-size="18" fill="#475569">允许</text><rect x="585" y="365" width="120" height="78" rx="10" fill="#dbeafe"/><text x="645" y="413" text-anchor="middle" font-size="18" fill="#475569">允许</text><rect x="715" y="365" width="120" height="78" rx="10" fill="#e2e8f0"/><text x="775" y="413" text-anchor="middle" font-size="18" fill="#475569">屏蔽</text><text x="210" y="492" text-anchor="middle" font-size="18" fill="#475569">writes Q</text><rect x="325" y="455" width="120" height="78" rx="10" fill="#dbeafe"/><text x="385" y="503" text-anchor="middle" font-size="18" fill="#475569">允许</text><rect x="455" y="455" width="120" height="78" rx="10" fill="#dbeafe"/><text x="515" y="503" text-anchor="middle" font-size="18" fill="#475569">允许</text><rect x="585" y="455" width="120" height="78" rx="10" fill="#dbeafe"/><text x="645" y="503" text-anchor="middle" font-size="18" fill="#475569">允许</text><rect x="715" y="455" width="120" height="78" rx="10" fill="#dbeafe"/><text x="775" y="503" text-anchor="middle" font-size="18" fill="#475569">允许</text><rect x="920" y="205" width="420" height="140" rx="16" fill="#fef3c7" stroke="#cbd5e1"/><text x="1130.0" y="240" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">位置 4：writes</text><text x="1130.0" y="273" text-anchor="middle" font-size="18" fill="#334155">只读取 The / young / engineer / writes</text><text x="1130.0" y="302" text-anchor="middle" font-size="18" fill="#334155">输出用于预测下一个 Token：code</text><rect x="920" y="390" width="420" height="140" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="1130.0" y="425" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">掩码在 Softmax 之前使用</text><text x="1130.0" y="458" text-anchor="middle" font-size="18" fill="#334155">未来分数 → −∞ → 权重 0</text><text x="1130.0" y="487" text-anchor="middle" font-size="18" fill="#334155">不是把未来分数设为 0</text><text x="700" y="625" text-anchor="middle" font-size="18" fill="#475569">允许矩阵是下三角；若布尔 True 表示“屏蔽”，代码中就标记严格上三角。</text><text x="700" y="675" text-anchor="middle" font-size="18" fill="#475569">每行至少保留一个可见 Key：整行都是 −∞ 时，普通 Softmax 会产生 NaN。</text></g></svg>