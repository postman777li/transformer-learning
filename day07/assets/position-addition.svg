<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="480" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">01 / 内容 + 位置：相加，不是拼接</text><text x="48" y="94" font-size="18" fill="#475569">同一个 Token 出现在不同位置时，Token Embedding 相同，加入的位置向量不同。</text><rect x="45" y="160" width="360" height="135" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="225.0" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">内容 E：这个 Token 是什么？</text><text x="225.0" y="228" text-anchor="middle" font-size="18" fill="#334155">[0.2, 0.5, 0.3, 0.8]</text><text x="450" y="235" text-anchor="middle" font-size="18" fill="#475569">+</text><rect x="495" y="160" width="360" height="135" rx="16" fill="#ede9fe" stroke="#cbd5e1"/><text x="675.0" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">位置 P：它位于哪里？</text><text x="675.0" y="228" text-anchor="middle" font-size="18" fill="#334155">pos=0：[0,1,0,1]</text><path d="M855,230 L930,230" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="950" y="160" width="405" height="135" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1152.5" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">输入 X = E + P</text><text x="1152.5" y="228" text-anchor="middle" font-size="18" fill="#334155">[0.2, 1.5, 0.3, 1.8]</text><text x="700" y="365" text-anchor="middle" font-size="18" fill="#475569">两者维度一致；[B,T,C] + [T,C] 通过广播，结果仍是 [B,T,C]。</text><text x="700" y="415" text-anchor="middle" font-size="18" fill="#475569">此图演示绝对位置相加方案；RoPE 在 Q/K 上旋转，不是这种相加方式。</text></g></svg>