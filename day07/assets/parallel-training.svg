<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1400" height="620" rx="24" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="58" font-size="30" font-weight="700" fill="#0f172a">03 / 训练可以并行：每个位置都只用自己的前缀预测下一词</text><text x="48" y="94" font-size="18" fill="#475569">用短片段演示输入与标签错开一位；完整句子采用同样的规则。</text><rect x="30" y="155" width="210" height="100" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="135.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The</text><text x="135.0" y="223" text-anchor="middle" font-size="18" fill="#334155">输入位置</text><path d="M135,255 L135,355" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="365" width="210" height="105" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="135.0" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">young</text><text x="135.0" y="433" text-anchor="middle" font-size="18" fill="#334155">预测目标</text><rect x="290" y="155" width="210" height="100" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="395.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">young</text><text x="395.0" y="223" text-anchor="middle" font-size="18" fill="#334155">输入位置</text><path d="M395,255 L395,355" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="290" y="365" width="210" height="105" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="395.0" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">engineer</text><text x="395.0" y="433" text-anchor="middle" font-size="18" fill="#334155">预测目标</text><rect x="550" y="155" width="210" height="100" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="655.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">engineer</text><text x="655.0" y="223" text-anchor="middle" font-size="18" fill="#334155">输入位置</text><path d="M655,255 L655,355" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="550" y="365" width="210" height="105" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="655.0" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">writes</text><text x="655.0" y="433" text-anchor="middle" font-size="18" fill="#334155">预测目标</text><rect x="810" y="155" width="210" height="100" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="915.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">writes</text><text x="915.0" y="223" text-anchor="middle" font-size="18" fill="#334155">输入位置</text><path d="M915,255 L915,355" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="810" y="365" width="210" height="105" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="915.0" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">code</text><text x="915.0" y="433" text-anchor="middle" font-size="18" fill="#334155">预测目标</text><rect x="1070" y="155" width="210" height="100" rx="16" fill="#dbeafe" stroke="#cbd5e1"/><text x="1175.0" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">code</text><text x="1175.0" y="223" text-anchor="middle" font-size="18" fill="#334155">输入位置</text><path d="M1175,255 L1175,355" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1070" y="365" width="210" height="105" rx="16" fill="#dcfce7" stroke="#cbd5e1"/><text x="1175.0" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">and</text><text x="1175.0" y="433" text-anchor="middle" font-size="18" fill="#334155">预测目标</text><text x="700" y="125" text-anchor="middle" font-size="18" fill="#475569">同一轮前向传播 + 因果 Attention（每个位置仅看左侧与自己）</text><text x="700" y="530" text-anchor="middle" font-size="18" fill="#475569">writes 的输出预测 code，但 writes 所在位置无法读取输入中的 code。</text><text x="700" y="575" text-anchor="middle" font-size="18" fill="#475569">训练：已知序列可并行计算损失；生成：未知的后续 Token 通常仍需逐个产生。</text></g></svg>